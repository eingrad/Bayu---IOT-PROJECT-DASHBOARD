# Bayu Sense - full stack (cloudflared + db + server + public-api + frontend)
#
# Setup:
#   cp .env.example .env      # then fill in real values
#   ./preflight.sh            # collision check
#   docker compose up -d --build
#
# Usage:
#   docker compose logs -f            # follow all logs
#   docker compose down               # stop (keeps DB data)
#   docker compose down -v            # stop & WIPE the database
#                                     # (re-runs database.sql on next up)
#
# This stack publishes NO host ports at all. Cloudflare reaches the frontend
# through this project's own cloudflared container over the compose network,
# the same way aqms and aquamind already work on this server. That means there
# is nothing to collide with the other projects — no port, no bind address.
#
# The compose project name groups and prefixes every resource (network, volume,
# images), keeping this separate from the other stacks on the host.

name: bayu-sense

services:
  # Each project on this server runs its own tunnel; this is ours.
  # Create a tunnel in Zero Trust -> Networks -> Tunnels, copy its token into
  # .env, and add a public hostname pointing at  http://frontend:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bayu-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

  db:
    image: postgres:16
    container_name: bayu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately not published. Use `docker compose exec db psql -U postgres
    # bayu_sense` for a shell, or see DEPLOYMENT.md to expose it temporarily.
    expose:
      - "5432"
    volumes:
      - bayu-db-data:/var/lib/postgresql/data
      # These run automatically ONLY on first init (empty volume), in order.
      - ./server/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/app-tables.sql:/docker-entrypoint-initdb.d/02-app-tables.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: bayu-server
    restart: unless-stopped
    # Chromium (Puppeteer PDF) crashes under Docker's default seccomp profile
    # because it blocks the clone3 syscall — relax it for this container.
    security_opt:
      - seccomp:unconfined
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                       # service name, not localhost
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASS: ${DB_ADMIN_PASS}
      DB_USER: ${DB_USER}
      DB_USER_PASS: ${DB_USER_PASS}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # MQTT — HiveMQ Cloud (outbound TLS, port 8883). Unrelated to the
      # mosquitto brokers the other two projects run internally.
      MQTT_BROKER_URL: ${MQTT_BROKER_URL}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # Average incoming readings over this window before writing one DB row.
      AGG_INTERVAL_MS: ${AGG_INTERVAL_MS:-300000}
    expose:
      - "5000"

  public-api:
    build: ./public-api
    container_name: bayu-public-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_USER_PASS}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASS: ${DB_ADMIN_PASS}
      API_KEY: ${PUBLIC_API_KEY}
      JWT_SECRET: ${PUBLIC_API_JWT_SECRET}
    expose:
      - "5050"

  frontend:
    build: .
    container_name: bayu-frontend
    restart: unless-stopped
    depends_on:
      - server
      - public-api
    # The tunnel's entry point, reachable only inside this compose network.
    # Point the Cloudflare public hostname at  http://frontend:80
    expose:
      - "80"

volumes:
  bayu-db-data:
