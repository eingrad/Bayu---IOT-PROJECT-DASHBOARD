# Single entry point for the whole stack.
#
# This container serves the React SPA and also proxies the API, public API and
# WebSocket, so everything the browser needs lives on one origin. That is what
# lets the frontend use relative URLs (/api, /ws, /public-api) with no CORS and
# no hostname compiled into the bundle.
#
# Cloudflare Tunnel points at this one port; nothing else in the stack is
# reachable from outside.

# WebSocket upgrades: pass "upgrade" through, but send "close" for normal
# requests so keep-alive still works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolving on a short TTL means a recreated
    # backend container (new IP) is picked up without restarting nginx —
    # nginx would otherwise cache the address it resolved at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Report generation uploads/downloads can be large.
    client_max_body_size 25m;

    # Main API. The prefix is stripped, so /api/login reaches Express as
    # /login, matching the routes it already defines.
    location /api/ {
        set $api_upstream server:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Puppeteer PDF reports can take a while to render.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Public API, same prefix-stripping arrangement.
    location /public-api/ {
        set $public_upstream public-api:5050;
        rewrite ^/public-api/(.*)$ /$1 break;
        proxy_pass http://$public_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket bridge. No prefix stripping: the ws server attaches to the HTTP
    # server without a path filter, so it accepts the upgrade as-is.
    location /ws {
        set $ws_upstream server:5000;
        proxy_pass http://$ws_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Sensor broadcasts are ~1/min; don't let an idle socket be culled.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
